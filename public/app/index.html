<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A1220" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F2F6FC" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trainyze">
  <meta name="format-detection" content="telephone=no">
  <title>Trainyze</title>
  <link rel="manifest" href="/app/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/app.css?v=__ASSETV__">
</head>
<body>
  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div>
          <p class="eyebrow" id="view-eyebrow"></p>
          <h1 id="view-title">Idag</h1>
        </div>
        <button class="icon-btn" id="refresh-btn" type="button" aria-label="Uppdatera">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
        </button>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Huvudmeny">
      <a href="#idag" data-tab="idag">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>Idag</span>
      </a>
      <a href="#plan" data-tab="plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Plan</span>
      </a>
      <a href="#coach" data-tab="coach">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
        <span>Coach</span>
      </a>
      <a href="#halsa" data-tab="halsa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
        <span>Hälsa</span>
      </a>
      <a href="#mer" data-tab="mer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        <span>Mer</span>
      </a>
    </nav>
  </div>

  <section class="login" id="login" hidden>
    <div class="login-card">
      <img src="/icon-192.png" alt="" class="login-logo" width="72" height="72">
      <h1>Trainyze</h1>
      <p class="muted">Logga in för att se dagens besked.</p>
      <form id="login-form" autocomplete="on">
        <label>Användarnamn
          <input name="username" autocomplete="username" autocapitalize="none" autocorrect="off" required>
        </label>
        <label>Lösenord
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="form-error" id="login-error" role="alert"></p>
        <button class="btn-primary" type="submit">Logga in</button>
      </form>
    </div>
  </section>

  <div class="boot" id="boot" aria-hidden="true"><div class="spinner"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app/app.js?v=__ASSETV__" defer></script>
</body>
</html>
